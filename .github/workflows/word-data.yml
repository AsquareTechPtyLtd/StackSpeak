name: Word data

# Guards the curriculum: the iOS bundle must stay in sync with shared/, and the
# content must stay free of stubs, self-leaking quiz answers, index drift, and
# unintended cross-stack duplicate terms. Pure bash + python3 — no Xcode needed.
on:
  push:
    paths:
      - "shared/**"
      - "scripts/**"
      - "ios/StackSpeak/Resources/**"
      - ".github/workflows/word-data.yml"
  pull_request:
    paths:
      - "shared/**"
      - "scripts/**"
      - "ios/StackSpeak/Resources/**"
      - ".github/workflows/word-data.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bundle sync (shared/ ↔ iOS resources)
        run: ./scripts/check-words-sync.sh

      - name: Lint word content (stubs / leaks / drift / duplicates)
        run: python3 scripts/check-words-content.py
